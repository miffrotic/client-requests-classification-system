services:
  django:
    build: .
    image: myhotelki-django
    container_name: django_app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./myhotelki:/app
      - staticfiles:/app/staticfiles
      - mediafiles:/app/mediafiles
    depends_on:
      db:
        condition: service_healthy
        restart: true
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
  nginx:
    image: nginx:latest
    container_name: nginx_server
    restart: always
    ports:
      - 80:80
      - 8080:443
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - staticfiles:/app/staticfiles
      - mediafiles:/app/mediafiles
    depends_on:
      - django

volumes:
  postgres_data:
  staticfiles:
  mediafiles: