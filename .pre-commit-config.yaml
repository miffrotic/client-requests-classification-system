repos:
  - repo: local
    hooks:
      - id: ruff-isort
        name: Ruff Isort
        entry: poetry run ruff check
        args: [ --select, I, --fix ]
        types: [ python ]
        language: system

      - id: ruff-format
        name: Ruff Formatter
        entry: poetry run ruff format
        types: [ python ]
        language: system

      - id: ruff-check-safe
        name: Ruff Linter Safe
        entry: poetry run ruff check
        args: [ --no-unsafe-fixes, --fix]
        types: [ python ]
        language: system

      - id: ruff-check-unsafe
        name: Ruff Linter Unsafe
        entry: poetry run ruff check
        args: [ --preview, --unsafe-fixes ]
        types: [ python ]
        language: system
