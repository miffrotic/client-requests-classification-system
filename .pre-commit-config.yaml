repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff Linter
        entry: poetry run ruff check --check
        args: [ --fix ]
        types: [ python ]
        language: system

      - id: ruff-format
        name: Ruff Formatter
        entry: poetry run ruff format
        types: [ python ]
        language: system
