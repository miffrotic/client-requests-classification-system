[project]
name = "classification-service"
version = "0.1.0"
description = ""
authors = []
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.118.0,<0.119.0)",
    "uvicorn[standard] (>=0.37.0,<0.38.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "sqlalchemy (>=2.0.43,<3.0.0)",
    "alembic (>=1.16.5,<2.0.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
    "pyjwt[crypto] (>=2.10.1,<3.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "pandas (>=2.3.3,<3.0.0)",
    "numpy (>=2.3.5,<3.0.0)",
    "nltk (>=3.9.2,<4.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[dependency-groups]
lint = [
    "pre-commit (>=4.3.0,<5.0.0)",
    "ruff (>=0.13.3,<0.14.0)"
]
test = [
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" }
]


[tool.poetry]
package-mode = false  # Disable package mode to avoid creating a package named after the project.


[tool.ruff]
include = [        # Include common file's extensions that should be linted and formated. (Specified default values)
    "*.py",
    "*.pyi",
    "*.pyw",
    "*.ipynb",
    "**/pyproject.toml",
]
exclude = [        # Exclude common directories that should not be linted and not formated. (Specified default values)
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 100  # Set maximum line length to 100 characters.
indent-width = 4   # Set indentation width to 4 spaces.  (Specified default value)


[tool.ruff.format]
quote-style = "double"                  # Enforce double quotes for strings.  (Specified default value)
indent-style = "space"                  # Use spaces for indentation.  (Specified default value)
skip-magic-trailing-comma = false       # Doesn't merge separated items in one line if it contains trailing comma and fits in one line.  (Specified default value)
line-ending = "auto"                    # Use the system's default line endings.  (Specified default value)
docstring-code-format = true            # Enable code formatting in docstrings.
docstring-code-line-length = "dynamic"  # Set docstring code line length formating.  (Specified default value for docstring-code-format = true)


[tool.ruff.lint]
select = [
    "AIR",      # Airflow – for airflow deprecated syntax
    "FAST",     # FastAPI – for FastAPI routers
    "YTT",      # Flake8-2020 – for python versions
    "ANN",      # Flake8-annotations – for function's annotations
    "ASYNC",    # Flake8-async – for async functions and managers
    "S",        # Flake8-bandit – for unsecurity code parts
    "BLE",      # Flake8-blind-except – for empty except body
    "FBT",      # Flake8-boolean-trap – for bool values in function's args and kwargs
    "B",        # Flake8-bugbear – for non-obvious python functionality syntax errors
    "A",        # Flake8-builtins – misuse of Python built-in names
    "COM",      # Flake8-commas – trailing/comma issues
    "C4",       # Flake8-comprehensions – best practices in comprehensions
    "DTZ",      # Flake8-datetimez – requires timezone-aware datetime objects
    "T10",      # Flake8-debugger – prohibits debugger functions in code
    "EXE",      # Flake8-executable – checks for executable files
    "ISC",      # Flake8-implicit-str-concat – warns on implicit string concatenation
    "ICN",      # Flake8-import-conventions – enforces conventional import aliases
    "LOG",      # Flake8-logging – proper logging usage
    "G",        # Flake8-logging-format – logging format string issues
    "INP",      # Flake8-no-pep420 – warns against non-PEP420 namespace usage (need __init__.py)
    "PIE",      # Flake8-pie – improvement suggestions for unnecessary things
    "T20",      # Flake8-print – prohibits print and p-print statements
    "PYI",      # Flake8-pyi – checks for type stub (.pyi) consistency
    "PT",       # Flake8-pytest-style – pytest best practices
    "RSE",      # Flake8-raise – proper raise statement usage without brackets
    "RET",      # Flake8-return – return statement issues
    "SLF",      # Flake8-self – prohibits to use protected and private attributes out of the class
    "SIM",      # Flake8-simplify – simplyfy code like loops, statement and others
    "SLOT",     # Flake8-slots – suggests use of __slots__ where appropriate
    "TID",      # Flake8-tidy-imports – enforces specific import styles (e.g., no relative imports)
    "ARG",      # Flake8-unused-arguments – flags unused arguments in functions and methods
    "PTH",      # Flake8-use-pathlib – encourages to use pathlib instead of os.path
    "FLY",      # Flynt – f-string conversion suggestions instead of join
    "I",        # Isort – sort all imports and remove dublicates
    "C90",      # McCabe – for complexity metric for functions
    "NPY",      # NumPy-specific rules – for numpy deprecated syntax
    "PD",       # Pandas-vet – checks pandas-specific code practices
    "N",        # PEP8 Naming – insist to use naming conventions
    "PERF",     # Perflint – for performance-related checks and unnecessary casts
    "E",        # Pycodestyle (E) – code beautify and readabilty
    "W",        # Pycodestyle (W) – warnings for style issues like spaces
    "DOC",      # Pydoclint – correct docstring content (linting)
    "D",        # Pydocstyle – correct docstring style (formatting)
    "F",        # Pyflakes – correct python syntax and unusable objects like imports and variables
    "PGH",      # Pygrep-hooks – checks comment annotations and mock library methods
    "PLC",      # Pylint-Conventions – checks for conventions and code standarts (ASCII, collections, typing and etc)
    "PLE",      # Pylint-Error – fix possibly errors caused of inproper usage of python syntax or builtin functionality
    "PLR",      # Pylint-Refactor – fix stupid and unreadable code
    "PLW",      # Pylint-Warning – fix unnecessary things, dublicates and future warning or errors
    "UP",       # Pyupgrade – fix outdated and deprecated python things
    "FURB",     # Refurb – improve the efficiency and readability of the code
    "RUF",      # Ruff-specific rules – additional Ruff checks
    "TRY",      # Tryceratops – try/except usage suggestions
]
ignore = [
    "ANN401",   # (DON'T LIKE IT)             Prohibits "Any" type annotation
    "ERA001",   # (DON'T LIKE IT)             Prohibits commented-out code
    "B904",     # (DON'T LIKE IT)             Insist to use from statement in except blocks
    "B912",     # (ONLY FOR PYTHON 3.14)      Prohibits to use map without "strict=..."
    "COM812",   # (CONFLICTS WITH FORMATTER)  Add trailing commas
    "COM819",   # (CONFLICTS WITH FORMATTER)  Remove trailing commas where they don't necessary
    "CPY",      # (DOESN'T NECCESARY)         Flake8-copyright – copyright header checks
    "DJ",       # (DOESN'T NECCESARY)         Flake8-django – Django specific syntax suggestions
    "EM",       # (DON'T LIKE IT)             Flake8-errmsg – error message style: prohibits formating strings in message of exception
    "FIX",      # (DOESN'T NECCESARY)         Flake8-fixme – prohibits flags FIXME, TODO and etc comments
    "FA",       # (DON'T LIKE IT)             Flake8-future-annotations – add __future__ import for annotations
    "INT",      # (DOESN'T NECCESARY)         Flake8-gettext – checks for proper translation usage
    "ISC002",   # (CONFLICTS WITH FORMATTER)  Insist to use brackets instead of slahes when a string is too long
    "G004",     # (DON'T LIKE IT)             Prohibits to use f-strings in logger message
    "Q",        # (CONFLICTS WITH FORMATTER)  Flake8-quotes – enforces quote style consistency
    "RET502",   # (DON'T LIKE IT)             Add None to return at not the end if somewhere else non-None returns
    "RET503",   # (DON'T LIKE IT)             Add return None at the end if somewhere else non-None returns
    "SIM105",   # (TOO SLOW)                  Replace pass in try-except-pass with contextlib.suppress
    "TID253",   # (DON'T LIKE IT)             Force to import heavy libraries lazily in function definitions not at the top
    "TD",       # (DOESN'T NECCESARY)         Flake8-todos – flags TODO comments
    "TC",       # (DOESN'T NECCESARY)         Flake8-type-checking – proper import of typing in type checks
    "E111",     # (CONFLICTS WITH FORMATTER)  Insure proper 4 spaces indent
    "E114",     # (CONFLICTS WITH FORMATTER)  Insure to use exactly not less than 4 spaces in indent
    "E117",     # (CONFLICTS WITH FORMATTER)  Insure to use exactly not more than 4 spaces in indent
    "W191",     # (CONFLICTS WITH FORMATTER)  Insist to use spaces instead of tabs
    "D100",     # (DON'T LIKE IT)             Insist to document public module
    "D101",     # (DON'T LIKE IT)             Insist to document public class
    "D102",     # (DON'T LIKE IT)             Insist to document public method
    "D103",     # (DON'T LIKE IT)             Insist to document public function
    "D104",     # (DON'T LIKE IT)             Insist to document public package
    "D105",     # (DON'T LIKE IT)             Insist to document magic method
    "D106",     # (DON'T LIKE IT)             Insist to document public nested class
    "D107",     # (DON'T LIKE IT)             Insist to document public init
    "D203",     # (DON'T LIKE IT)             Insist to have 1 blank line before docstring
    "D206",     # (CONFLICTS WITH FORMATTER)  Insist to use spaces instead of tabs in docstring
    "D212",     # (DON'T LIKE IT)             Insist to position summary on the first physical line of the docstring
    "D300",     # (CONFLICTS WITH FORMATTER)  Replace single quotes with double quotes
    "PLW1514",  # (DON'T LIKE IT)             Insist to use encoding in open function
    "TRY300",   # (DON'T LIKE IT)             Insist to use else statement in try-except for returns
    "S301",     # (DON'T LIKE IT)             Prohibit to use pickle
    "S403",     # (DON'T LIKE IT)             Prohibit to use pickle
]
fixable = ["ALL"]  # Enable all auto-fixable rules.  (Specified default value)
unfixable = []     # No unfixable rules specified.  (Specified default value)
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"  # Allow variables that start with an underscore or double underscore as dummy variables.  (Specified default value)


[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [  # Allow to use fastapi functions as immutable in endpoints.
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
]


[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = true  # Allow implicit string concatenation across multiple lines.  (Specified default value)


[tool.ruff.lint.flake8-import-conventions.aliases]  # Specify conventional import aliases for commonly used libraries.  (Specified default values)
altair = "alt"
matplotlib = "mpl"
"matplotlib.pyplot" = "plt"
numpy = "np"
"numpy.typing" = "npt"
pandas = "pd"
seaborn = "sns"
tensorflow = "tf"
tkinter = "tk"
holoviews = "hv"
panel = "pn"
"plotly.express" = "px"
polars = "pl"
pyarrow = "pa"
"xml.etree.ElementTree" = "ET"


[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "tuple"       # Enforce using tuple for parametrize names. Example: @pytest.mark.parametrize(("name1", "name2"), ...)  (Specified default value)
parametrize-values-row-type = "tuple"  # Enforce using tuple for parametrize values. Example: @pytest.mark.parametrize(("name1", "name2"), [(1, 2), (3, 4)])  (Specified default value)
parametrize-values-type = "list"       # Enforce using list for parametrize values. Example: @pytest.mark.parametrize("name", [1, 2, 3])  (Specified default value)


[tool.ruff.lint.flake8-quotes]  # Depends on formatter.quote-style setting
docstring-quotes = "double"     # Enforce double quotes for docstrings.  (Specified default value)
inline-quotes = "double"        # Enforce double quotes for inline strings.  (Specified default value)
multiline-quotes = "double"     # Enforce double quotes for multiline strings.  (Specified default value)


[tool.ruff.lint.isort]
lines-after-imports = 2          # Add two blank lines after the import section.
lines-between-types = 1          # Add one blank line between direct imports and from-state imports.
split-on-trailing-comma = false  # Fold imports if they fit in one line even if there's a trailing comma.


[tool.ruff.lint.mccabe]
max-complexity = 15  # Set maximum allowed complexity for functions to 15 (if/elif, try/except, for and etc every thing add +1 complexity).


[tool.ruff.lint.pep8-naming]
ignore-names = [  # Ignore specific names when checking for nameing conventions.  (Specified default values)
    "setUp",
    "tearDown",
    "setUpClass",
    "tearDownClass",
    "setUpModule",
    "tearDownModule",
    "asyncSetUp",
    "asyncTearDown",
    "setUpTestData",
    "failureException",
    "longMessage",
    "maxDiff",
]


[tool.ruff.lint.pycodestyle]  # Depends on ruff line-length setting
max-doc-length = 90  # Set maximum docstring line length to 100 characters.


[tool.ruff.lint.pylint]
allow-dunder-method-names = [  # Add to list of allow specific dunder method names commonly used in SQLAlchemy models.
    "__tablename__",
    "__table_args__",
]
max-args = 10                  # Set maximum number of arguments for functions/methods to 10.
max-branches = 15               # Set maximum number of branches (if, elif, else, try, for, match) in functions/methods to 15.


[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]              # Ignore unused imports in __init__.py files.
"migrations/*.py" = ["F403", "N999"]  # Ignore 'from module import *' and invalid naming in migration files.
"middlewares/*.py" = ["PLR0911"]      # Ignore too-many-returns in middlewares files.
